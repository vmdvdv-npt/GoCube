name: Temporary Development Workspace board filter patch

on:
  push:
    branches:
      - feature/development-board-filter

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply board filter implementation, tests, and canonical docs
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          workspace = "src/app/development/DevelopmentWorkspace.tsx"

          replace_exact(
              workspace,
              """export const visibleCheckpointsForLifecycle = (\n  checkpoints: readonly AlphaZeroCheckpointDescriptor[],\n  showClosedLineages: boolean,\n): readonly AlphaZeroCheckpointDescriptor[] =>\n  showClosedLineages\n    ? checkpoints\n    : checkpoints.filter((checkpoint) => (checkpoint.lineageStatus ?? 'ACTIVE') === 'ACTIVE');\n""",
              """export const visibleCheckpointsForLifecycle = (\n  checkpoints: readonly AlphaZeroCheckpointDescriptor[],\n  showClosedLineages: boolean,\n): readonly AlphaZeroCheckpointDescriptor[] =>\n  showClosedLineages\n    ? checkpoints\n    : checkpoints.filter((checkpoint) => (checkpoint.lineageStatus ?? 'ACTIVE') === 'ACTIVE');\n\nexport const ALL_BOARDS_FILTER = 'all' as const;\n\nexport type BoardFilterValue =\n  | typeof ALL_BOARDS_FILTER\n  | `${AlphaZeroCheckpointDescriptor['topology']}:${number}`;\n\nexport type BoardFilterOption = Readonly<{\n  value: BoardFilterValue;\n  label: string;\n}>;\n\nconst boardFilterValueForCheckpoint = (\n  checkpoint: AlphaZeroCheckpointDescriptor,\n): BoardFilterValue => `${checkpoint.topology}:${checkpoint.size}` as BoardFilterValue;\n\nconst boardFilterLabel = (checkpoint: AlphaZeroCheckpointDescriptor): string => {\n  const topology = `${checkpoint.topology.charAt(0).toUpperCase()}${checkpoint.topology.slice(1)}`;\n  return `${topology} ${checkpoint.size}×${checkpoint.size}`;\n};\n\nexport const boardFilterOptionsFromCheckpoints = (\n  checkpoints: readonly AlphaZeroCheckpointDescriptor[],\n): readonly BoardFilterOption[] => {\n  const seen = new Set<BoardFilterValue>();\n  const options: BoardFilterOption[] = [\n    Object.freeze({ value: ALL_BOARDS_FILTER, label: 'All boards' }),\n  ];\n\n  for (const checkpoint of checkpoints) {\n    const value = boardFilterValueForCheckpoint(checkpoint);\n    if (seen.has(value)) continue;\n    seen.add(value);\n    options.push(Object.freeze({ value, label: boardFilterLabel(checkpoint) }));\n  }\n\n  return options;\n};\n\nexport const visibleCheckpointsForFilters = (\n  checkpoints: readonly AlphaZeroCheckpointDescriptor[],\n  showClosedLineages: boolean,\n  boardFilter: BoardFilterValue,\n): readonly AlphaZeroCheckpointDescriptor[] =>\n  visibleCheckpointsForLifecycle(checkpoints, showClosedLineages).filter(\n    (checkpoint) =>\n      boardFilter === ALL_BOARDS_FILTER || boardFilterValueForCheckpoint(checkpoint) === boardFilter,\n  );\n\nexport const checkpointIdWithFallback = (\n  currentId: string,\n  visibleCheckpoints: readonly AlphaZeroCheckpointDescriptor[],\n): string => {\n  if (visibleCheckpoints.some((checkpoint) => checkpoint.id === currentId)) return currentId;\n  return visibleCheckpoints[visibleCheckpoints.length - 1]?.id ?? '';\n};\n""",
              "board filter helpers",
          )

          replace_exact(
              workspace,
              """  const [checkpoints, setCheckpoints] = useState<readonly AlphaZeroCheckpointDescriptor[]>([]);\n  const [showClosedLineages, setShowClosedLineages] = useState(false);\n  const [blackCheckpointId, setBlackCheckpointId] = useState(initialSettings.blackCheckpointId ?? '');\n""",
              """  const [checkpoints, setCheckpoints] = useState<readonly AlphaZeroCheckpointDescriptor[]>([]);\n  const [showClosedLineages, setShowClosedLineages] = useState(false);\n  const [boardFilter, setBoardFilter] = useState<BoardFilterValue>(ALL_BOARDS_FILTER);\n  const [blackCheckpointId, setBlackCheckpointId] = useState(initialSettings.blackCheckpointId ?? '');\n""",
              "board filter state",
          )

          replace_exact(
              workspace,
              """  const activeCheckpoints = useMemo(\n    () => visibleCheckpointsForLifecycle(checkpoints, false),\n    [checkpoints],\n  );\n  const visibleCheckpoints = useMemo(\n    () => visibleCheckpointsForLifecycle(checkpoints, showClosedLineages),\n    [checkpoints, showClosedLineages],\n  );\n  const blackCheckpoint = useMemo(\n    () => checkpoints.find((checkpoint) => checkpoint.id === blackCheckpointId) ?? null,\n    [blackCheckpointId, checkpoints],\n  );\n  const whiteCheckpoint = useMemo(\n    () => checkpoints.find((checkpoint) => checkpoint.id === whiteCheckpointId) ?? null,\n    [checkpoints, whiteCheckpointId],\n  );\n""",
              """  const boardFilterOptions = useMemo(\n    () => boardFilterOptionsFromCheckpoints(checkpoints),\n    [checkpoints],\n  );\n  const visibleCheckpoints = useMemo(\n    () => visibleCheckpointsForFilters(checkpoints, showClosedLineages, boardFilter),\n    [boardFilter, checkpoints, showClosedLineages],\n  );\n  const blackCheckpoint = useMemo(\n    () => visibleCheckpoints.find((checkpoint) => checkpoint.id === blackCheckpointId) ?? null,\n    [blackCheckpointId, visibleCheckpoints],\n  );\n  const whiteCheckpoint = useMemo(\n    () => visibleCheckpoints.find((checkpoint) => checkpoint.id === whiteCheckpointId) ?? null,\n    [visibleCheckpoints, whiteCheckpointId],\n  );\n""",
              "filtered checkpoint memos",
          )

          replace_exact(
              workspace,
              """  const selectActiveFallback = (): void => {\n    const fallback = latestCheckpoint(activeCheckpoints) ?? activeCheckpoints[0];\n    setBlackCheckpointId((current) =>\n      activeCheckpoints.some((checkpoint) => checkpoint.id === current)\n        ? current\n        : fallback?.id ?? '',\n    );\n    setWhiteCheckpointId((current) =>\n      activeCheckpoints.some((checkpoint) => checkpoint.id === current)\n        ? current\n        : fallback?.id ?? '',\n    );\n  };\n""",
              """  const selectFilteredFallback = (\n    nextShowClosedLineages: boolean,\n    nextBoardFilter: BoardFilterValue,\n  ): void => {\n    const filteredCheckpoints = visibleCheckpointsForFilters(\n      checkpoints,\n      nextShowClosedLineages,\n      nextBoardFilter,\n    );\n    setBlackCheckpointId((current) => checkpointIdWithFallback(current, filteredCheckpoints));\n    setWhiteCheckpointId((current) => checkpointIdWithFallback(current, filteredCheckpoints));\n  };\n""",
              "combined fallback selection",
          )

          replace_exact(
              workspace,
              """      const health = await gateway.health();\n      const availableCheckpoints = await gateway.listCheckpoints();\n      const activeAvailableCheckpoints = visibleCheckpointsForLifecycle(availableCheckpoints, false);\n      setConnection('available');\n      setServiceLabel(`${health.service} ${health.version} · protocol v${health.protocolVersion}`);\n      setCheckpoints(availableCheckpoints);\n      const fallback = latestCheckpoint(activeAvailableCheckpoints) ?? activeAvailableCheckpoints[0];\n      if (fallback) {\n        setBlackCheckpointId((current) =>\n          activeAvailableCheckpoints.some((checkpoint) => checkpoint.id === current)\n            ? current\n            : fallback.id,\n        );\n        setWhiteCheckpointId((current) =>\n          activeAvailableCheckpoints.some((checkpoint) => checkpoint.id === current)\n            ? current\n            : fallback.id,\n        );\n      } else {\n        setBlackCheckpointId('');\n        setWhiteCheckpointId('');\n      }\n""",
              """      const health = await gateway.health();\n      const availableCheckpoints = await gateway.listCheckpoints();\n      const availableBoardOptions = boardFilterOptionsFromCheckpoints(availableCheckpoints);\n      const nextBoardFilter = availableBoardOptions.some((option) => option.value === boardFilter)\n        ? boardFilter\n        : ALL_BOARDS_FILTER;\n      const visibleAvailableCheckpoints = visibleCheckpointsForFilters(\n        availableCheckpoints,\n        showClosedLineages,\n        nextBoardFilter,\n      );\n      setConnection('available');\n      setServiceLabel(`${health.service} ${health.version} · protocol v${health.protocolVersion}`);\n      setCheckpoints(availableCheckpoints);\n      setBoardFilter(nextBoardFilter);\n      const fallback = latestCheckpoint(visibleAvailableCheckpoints) ?? visibleAvailableCheckpoints[0];\n      if (fallback) {\n        setBlackCheckpointId((current) =>\n          visibleAvailableCheckpoints.some((checkpoint) => checkpoint.id === current)\n            ? current\n            : fallback.id,\n        );\n        setWhiteCheckpointId((current) =>\n          visibleAvailableCheckpoints.some((checkpoint) => checkpoint.id === current)\n            ? current\n            : fallback.id,\n        );\n      } else {\n        setBlackCheckpointId('');\n        setWhiteCheckpointId('');\n      }\n""",
              "board-aware connection fallback",
          )

          replace_exact(
              workspace,
              """      setServiceLabel('AlphaZero unavailable');\n      setCheckpoints([]);\n      setBlackCheckpointId('');\n""",
              """      setServiceLabel('AlphaZero unavailable');\n      setCheckpoints([]);\n      setBoardFilter(ALL_BOARDS_FILTER);\n      setBlackCheckpointId('');\n""",
              "reset board filter when unavailable",
          )

          replace_exact(
              workspace,
              """                  onChange={(event) => {\n                    const checked = event.target.checked;\n                    setShowClosedLineages(checked);\n                    if (!checked) selectActiveFallback();\n                  }}\n""",
              """                  onChange={(event) => {\n                    const checked = event.target.checked;\n                    setShowClosedLineages(checked);\n                    selectFilteredFallback(checked, boardFilter);\n                  }}\n""",
              "combined lifecycle handler",
          )

          replace_exact(
              workspace,
              """            <div className=\"development-alpha-zero__grid\">\n              <label>\n                Black checkpoint\n""",
              """            <div className=\"development-alpha-zero__grid\">\n              <label>\n                Board filter\n                <select\n                  value={boardFilter}\n                  disabled={connection !== 'available' || generating}\n                  onChange={(event) => {\n                    const value = event.target.value as BoardFilterValue;\n                    setBoardFilter(value);\n                    selectFilteredFallback(showClosedLineages, value);\n                  }}\n                >\n                  {boardFilterOptions.map((option) => (\n                    <option value={option.value} key={option.value}>{option.label}</option>\n                  ))}\n                </select>\n              </label>\n\n              <label>\n                Black checkpoint\n""",
              "Board filter control",
          )

          test_path = "src/app/development/DevelopmentWorkspaceCompatibility.test.ts"
          replace_exact(
              test_path,
              """import {\n  checkpointCompatibilityError,\n  generatedGameCompatibilityError,\n  visibleCheckpointsForLifecycle,\n} from './DevelopmentWorkspace';\n""",
              """import {\n  ALL_BOARDS_FILTER,\n  boardFilterOptionsFromCheckpoints,\n  checkpointCompatibilityError,\n  checkpointIdWithFallback,\n  generatedGameCompatibilityError,\n  visibleCheckpointsForFilters,\n  visibleCheckpointsForLifecycle,\n} from './DevelopmentWorkspace';\n""",
              "test imports",
          )

          replace_exact(
              test_path,
              """  it('accepts compatible Cube/Cube checkpoints', () => {\n""",
              """  it('builds unique board filter options from loaded checkpoints', () => {\n    const checkpoints = [\n      checkpoint({ id: 'cube-4-a', topology: 'cube', size: 4 }),\n      checkpoint({ id: 'cube-4-b', topology: 'cube', size: 4 }),\n      checkpoint({ id: 'torus-9', topology: 'torus', size: 9 }),\n      checkpoint({ id: 'cube-5', topology: 'cube', size: 5 }),\n    ];\n\n    expect(boardFilterOptionsFromCheckpoints(checkpoints)).toEqual([\n      { value: ALL_BOARDS_FILTER, label: 'All boards' },\n      { value: 'cube:4', label: 'Cube 4×4' },\n      { value: 'torus:9', label: 'Torus 9×9' },\n      { value: 'cube:5', label: 'Cube 5×5' },\n    ]);\n  });\n\n  it('filters checkpoints by board topology and size', () => {\n    const checkpoints = [\n      checkpoint({ id: 'cube-4', topology: 'cube', size: 4 }),\n      checkpoint({ id: 'torus-9-a', topology: 'torus', size: 9 }),\n      checkpoint({ id: 'torus-9-b', topology: 'torus', size: 9 }),\n    ];\n\n    expect(visibleCheckpointsForFilters(checkpoints, true, 'torus:9').map((item) => item.id)).toEqual([\n      'torus-9-a',\n      'torus-9-b',\n    ]);\n  });\n\n  it('combines closed-lineage visibility with the board filter', () => {\n    const checkpoints = [\n      checkpoint({ id: 'torus-active', topology: 'torus', size: 9, lineageStatus: 'ACTIVE' }),\n      checkpoint({ id: 'torus-archived', topology: 'torus', size: 9, lineageStatus: 'ARCHIVED' }),\n      checkpoint({ id: 'cube-active', topology: 'cube', size: 4, lineageStatus: 'ACTIVE' }),\n    ];\n\n    expect(visibleCheckpointsForFilters(checkpoints, false, 'torus:9').map((item) => item.id)).toEqual([\n      'torus-active',\n    ]);\n    expect(visibleCheckpointsForFilters(checkpoints, true, 'torus:9').map((item) => item.id)).toEqual([\n      'torus-active',\n      'torus-archived',\n    ]);\n  });\n\n  it('falls back to the last visible checkpoint when the current selection is filtered out', () => {\n    const visible = [\n      checkpoint({ id: 'torus-9-a', topology: 'torus', size: 9 }),\n      checkpoint({ id: 'torus-9-b', topology: 'torus', size: 9 }),\n    ];\n\n    expect(checkpointIdWithFallback('cube-hidden', visible)).toBe('torus-9-b');\n    expect(checkpointIdWithFallback('torus-9-a', visible)).toBe('torus-9-a');\n    expect(checkpointIdWithFallback('anything', [])).toBe('');\n  });\n\n  it('accepts compatible Cube/Cube checkpoints', () => {\n""",
              "board filter tests",
          )

          docs = "docs/GAME_CUBE_GO.md"
          replace_exact(
              docs,
              """- connection status локального AlphaZero service;\n- topology;\n- size;\n- `Black checkpoint`;\n- `White checkpoint`;\n- `MCTS simulations`;\n- `Generate game`.\n""",
              """- connection status локального AlphaZero service;\n- topology;\n- size;\n- `Show closed lineages`;\n- `Board filter`;\n- `Black checkpoint`;\n- `White checkpoint`;\n- `MCTS simulations`;\n- `Generate game`.\n""",
              "Development Workspace control list",
          )

          replace_exact(
              docs,
              """Checkpoint выбирается по стабильной identity, а не по отображаемому filesystem path.\n\nРазрешён self-play: один и тот же checkpoint можно выбрать за Black и White.\n""",
              """Checkpoint выбирается по стабильной identity, а не по отображаемому filesystem path.\n\n`Board filter` строится динамически из реально загруженных checkpoint descriptors по уникальным парам topology + size. В списке всегда есть `All boards`; остальные варианты показываются как `Cube N×N`, `Torus N×N` и аналогично для других доступных topology.\n\n`Black checkpoint` и `White checkpoint` используют один общий набор видимых checkpoints: сначала применяется lifecycle visibility (`ACTIVE` либо также закрытые lineages при включённом `Show closed lineages`), затем выбранный `Board filter`. Если смена board filter скрывает текущий checkpoint, соответствующий selector автоматически переходит на последний checkpoint из нового filtered list; при пустом результате selection сбрасывается.\n\nРазрешён self-play: один и тот же checkpoint можно выбрать за Black и White.\n""",
              "Development Workspace board filter behavior",
          )

      - name: Install dependencies
        run: npm ci

      - name: Run targeted unit tests
        run: npm test -- src/app/development/DevelopmentWorkspaceCompatibility.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check

      - name: Commit verified change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-development-board-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/development/DevelopmentWorkspace.tsx \
                  src/app/development/DevelopmentWorkspaceCompatibility.test.ts \
                  docs/GAME_CUBE_GO.md \
                  .github/workflows/tmp-development-board-filter.yml
          git commit -m "Add board filter to Development Workspace"
          git push origin HEAD:${GITHUB_REF_NAME}
