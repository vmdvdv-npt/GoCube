name: Release prep PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply embedded patch
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/release-prep-bootstrap.yml').read_text().splitlines()
          start = source.index("          python <<'PY'") + 1
          end = source.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/release-prep.py').write_text(script)
          PY
          python /tmp/release-prep.py
          npm install --package-lock-only --ignore-scripts
          rm .github/workflows/release-prep-bootstrap.yml .github/workflows/release-prep-pr.yml
          git diff --check
      - name: Commit prepared branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize 0.2 release acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
