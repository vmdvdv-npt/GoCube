name: Work 1 execution artifact probe

on:
  pull_request:
    branches:
      - engine
    paths:
      - .github/workflows/work1-execution-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Toolchain identities
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npm --version
          rustc --version
          cargo --version
          gcc --version | head -n 1
          cmake --version | head -n 1
          docker --version

      - name: tsumego.js npm artifact
        shell: bash
        run: |
          set -euxo pipefail
          npm view tsumego.js@1.1.0 version dist.tarball dist.integrity dist.shasum --json

      - name: Relevance-Zone container identity
        shell: bash
        run: |
          set -euxo pipefail
          docker pull rockmanray/gorzone
          docker image inspect rockmanray/gorzone --format '{{json .RepoDigests}}'

      - name: Pinned source revisions are fetchable
        shell: bash
        run: |
          set -euxo pipefail
          probe_revision() {
            repo="$1"
            revision="$2"
            git ls-remote "https://github.com/${repo}.git" | grep -F "$revision"
          }
          probe_revision d180cf/tsumego.js 58a079aac928c7bd59dc398d014f1f2b743f692e
          probe_revision cameron-martin/tsumego-solver 7408523ae34d9f890eef08d7f39fae683dee1a4e
          probe_revision rlglab/study-LD-RZ be5c678694b3d2326e9924dad4443e0910d52cdc
          probe_revision facebookresearch/darkforestGo ef1885ed5004dac8cbea2cbd3644706565af0876
