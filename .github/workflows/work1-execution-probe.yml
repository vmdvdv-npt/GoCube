name: Work 1 runtime benchmark probe

on:
  pull_request:
    branches:
      - engine
    paths:
      - .github/workflows/work1-execution-probe.yml

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Export exact GoCube Work 1 corpus
        shell: bash
        run: |
          set -euxo pipefail
          npm ci
          cat > .work1-export.ts <<'EOF'
          import { buildReuseSpikeCorpus } from './src/core/endgame/testlab/ReuseSpikeCorpus';
          console.log(JSON.stringify(buildReuseSpikeCorpus()));
          EOF
          npx vite-node .work1-export.ts > /tmp/work1-corpus.json
          rm .work1-export.ts
          node -e 'const c=require("/tmp/work1-corpus.json"); console.log(c.map(x=>({id:x.id,size:x.position.boardSize,status:x.sourceStatus,sgf:x.sgf})))'

      - name: Benchmark published tsumego.js 1.1.0
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='sha512-W/MQDhaMKiM15wd8YRjonXgZm+T1YxZRhavvv0sDPDywEidgDzN8s5Jum/aU0GIruGz5L/GDygn2/TQ34+btcg=='
          ACTUAL="$(npm view tsumego.js@1.1.0 dist.integrity)"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/tsumego-js
          cd /tmp/tsumego-js
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund tsumego.js@1.1.0 >/dev/null
          cat > benchmark.cjs <<'EOF'
          const fs = require('node:fs');
          const { performance } = require('node:perf_hooks');
          const tsumego = require('tsumego.js');
          const corpus = JSON.parse(fs.readFileSync('/tmp/work1-corpus.json', 'utf8'));
          const opposite = c => c === 'black' ? 'white' : 'black';
          const pl = c => c === 'black' ? 'B' : 'W';
          const targetColor = problem => {
            const colors = new Set();
            for (const target of problem.position.targetCoordinates) {
              const stone = problem.position.stones.find(s => s.row === target.row && s.column === target.column);
              if (stone) colors.add(stone.color);
            }
            return colors.size === 1 ? [...colors][0] : undefined;
          };
          const withPlayer = (sgf, player) => sgf.replace(/PL\[[BW]\]/, `PL[${pl(player)}]`);
          for (const problem of corpus) {
            const target = targetColor(problem);
            if (!target) {
              console.log(JSON.stringify({solver:'tsumego-js',case:problem.id,unsupported:true}));
              continue;
            }
            for (const [role, firstPlayer] of [['attacker', opposite(target)], ['defender', target]]) {
              const started = performance.now();
              try {
                const move = tsumego.solve(withPlayer(problem.sgf, firstPlayer));
                console.log(JSON.stringify({solver:'tsumego-js',case:problem.id,size:problem.position.boardSize,role,firstPlayer,solved:true,firstPlayerWins:typeof move === 'string' && move.length > 0,move:move ?? null,elapsedMs:performance.now()-started}));
              } catch (error) {
                console.log(JSON.stringify({solver:'tsumego-js',case:problem.id,size:problem.position.boardSize,role,firstPlayer,solved:false,error:String(error),elapsedMs:performance.now()-started}));
              }
            }
          }
          EOF
          node benchmark.cjs | tee /tmp/tsumego-js-results.jsonl

      - name: Build pinned Cameron-Martin black-box harness
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/cameron-martin/tsumego-solver.git /tmp/cameron
          cd /tmp/cameron
          git checkout --quiet 7408523ae34d9f890eef08d7f39fae683dee1a4e
          test "$(git rev-parse HEAD)" = '7408523ae34d9f890eef08d7f39fae683dee1a4e'
          test "$(git hash-object Cargo.lock)" = 'bc18b817de7811efa91be5d16ebd95d703948faf'
          cat > src/bin/work1_benchmark.rs <<'EOF'
          use std::{env, fs, time::Duration};
          use tsumego_solver::puzzle::{Profile, Puzzle};

          fn main() {
              let path = env::args().nth(1).expect("SGF path");
              let sgf = fs::read_to_string(path).expect("read SGF");
              let mut puzzle = Puzzle::<Profile>::from_sgf(&sgf);
              let solved = puzzle.solve_with_timeout(Duration::from_secs(10));
              let proved = solved && puzzle.is_proved();
              let move_text = if proved { format!("{:?}", puzzle.first_move()) } else { String::new() };
              println!("solved={} proved={} nodes={} move={}", solved, proved, puzzle.profiler.node_count, move_text);
          }
          EOF
          cargo build --locked --release --bin work1_benchmark

      - name: Benchmark pinned Cameron-Martin executable
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/cameron-benchmark.cjs <<'EOF'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { performance } = require('node:perf_hooks');
          const corpus = JSON.parse(fs.readFileSync('/tmp/work1-corpus.json', 'utf8'));
          const opposite = c => c === 'black' ? 'white' : 'black';
          const pl = c => c === 'black' ? 'B' : 'W';
          const targetColor = problem => {
            const colors = new Set();
            for (const target of problem.position.targetCoordinates) {
              const stone = problem.position.stones.find(s => s.row === target.row && s.column === target.column);
              if (stone) colors.add(stone.color);
            }
            return colors.size === 1 ? [...colors][0] : undefined;
          };
          const withPlayer = (sgf, player) => sgf.replace(/PL\[[BW]\]/, `PL[${pl(player)}]`);
          for (const problem of corpus) {
            const target = targetColor(problem);
            if (!target) continue;
            for (const [role, firstPlayer] of [['attacker', opposite(target)], ['defender', target]]) {
              const path = `/tmp/cameron-${problem.id.replace(/[^a-z0-9]+/gi,'-')}-${role}.sgf`;
              fs.writeFileSync(path, withPlayer(problem.sgf, firstPlayer));
              const started = performance.now();
              const proc = spawnSync('/tmp/cameron/target/release/work1_benchmark', [path], {encoding:'utf8', timeout:15000});
              const elapsedMs = performance.now() - started;
              const stdout = proc.stdout.trim();
              const match = /^solved=(true|false) proved=(true|false) nodes=(\d+) move=(.*)$/.exec(stdout);
              console.log(JSON.stringify({solver:'cameron-martin',case:problem.id,size:problem.position.boardSize,role,firstPlayer,elapsedMs,exitCode:proc.status,stdout,stderr:proc.stderr.trim(),solved:match?.[1]==='true',firstPlayerWins:match?.[2]==='true',nodes:match?Number(match[3]):undefined,move:match?.[4]||undefined}));
            }
          }
          EOF
          node /tmp/cameron-benchmark.cjs | tee /tmp/cameron-results.jsonl
