name: Work 1 remaining runtime probe

on:
  pull_request:
    branches:
      - engine
    paths:
      - .github/workflows/work1-execution-probe.yml

permissions:
  contents: read

jobs:
  relevance-zone-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect pinned Relevance-Zone runtime
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE='rockmanray/gorzone@sha256:1d1b6babbd6c5978c14394aad16aeffcff3106eb78574ee8a577bbeec596849f'
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}} WORKDIR={{json .Config.WorkingDir}}'
          docker run --rm --entrypoint sh "$IMAGE" -lc '
            set -eu
            echo "PWD=$(pwd)"
            echo "--- candidate executables/configs ---"
            find / -xdev \( -type f -o -type l \) \( -name CGI -o -name "*tsumego*" -o -name "RZS-*.cfg" -o -name candidate.list \) 2>/dev/null | head -n 160
            echo "--- likely project roots ---"
            find /root /home /workspace /opt -maxdepth 3 -type d 2>/dev/null | head -n 160
          '

      - name: Inspect pinned RZ source contract without vendoring
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/rlglab/study-LD-RZ.git /tmp/rz
          cd /tmp/rz
          git checkout --quiet be5c678694b3d2326e9924dad4443e0910d52cdc
          test "$(git rev-parse HEAD)" = 'be5c678694b3d2326e9924dad4443e0910d52cdc'
          echo '--- tsumego_solver references ---'
          grep -RIn --exclude-dir=.git -E 'tsumego_solver|TsumegoSolver|candidate\.list|winning_color|turn_color' . | head -n 240 || true
          echo '--- top-level files ---'
          find . -maxdepth 3 -type f | sort | head -n 240

  darkforest-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect and build pinned Darkforest tsumego target
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/facebookresearch/darkforestGo.git /tmp/darkforest
          cd /tmp/darkforest
          git checkout --quiet ef1885ed5004dac8cbea2cbd3644706565af0876
          test "$(git rev-parse HEAD)" = 'ef1885ed5004dac8cbea2cbd3644706565af0876'
          echo '--- board size ---'
          grep -RIn --exclude-dir=.git -E '#define[[:space:]]+BOARD_SIZE|BOARD_SIZE[[:space:]]*=' board common tsumego | head -n 80 || true
          echo '--- tsumego build references ---'
          grep -RIn --exclude-dir=.git -E 'test_solver|solver\.c|TsumegoSearch' CMakeLists.txt board common tsumego | head -n 160 || true
          echo '--- C sources ---'
          find board common tsumego -maxdepth 2 -type f \( -name '*.c' -o -name '*.h' \) | sort | head -n 240
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target test_solver -j2
          find . -maxdepth 4 -type f -perm -111 -print | sort | head -n 80
