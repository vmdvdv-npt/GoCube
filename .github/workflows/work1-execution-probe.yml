name: Work 1 remaining runtime benchmark

on:
  pull_request:
    branches:
      - engine
    paths:
      - .github/workflows/work1-execution-probe.yml

permissions:
  contents: read

jobs:
  relevance-zone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Export common corpus and RZ black-box inputs
        shell: bash
        run: |
          set -euxo pipefail
          npm ci
          cat > .work1-rz-export.ts <<'EOF'
          import fs from 'node:fs';
          import { buildReuseSpikeCorpus } from './src/core/endgame/testlab/ReuseSpikeCorpus';
          const corpus = buildReuseSpikeCorpus();
          fs.mkdirSync('/tmp/rz-problems', { recursive: true });
          const letters = 'abcdefghijklmnopqrstuvwxyz';
          const sgfCoord = (row:number, column:number) => `${letters[column]}${letters[row]}`;
          const targetColor = (p:any) => {
            const colors = new Set(p.position.targetCoordinates.map((t:any) => p.position.stones.find((s:any) => s.row === t.row && s.column === t.column)?.color).filter(Boolean));
            return colors.size === 1 ? [...colors][0] as string : undefined;
          };
          const opposite = (c:string) => c === 'black' ? 'white' : 'black';
          const allRegion = (size:number) => Array.from({length:size*size},(_,i)=>sgfCoord(Math.floor(i/size),i%size)).join(',');
          const candidate:string[] = [];
          for (const p of corpus) {
            const target = targetColor(p); if (!target) continue;
            const crucial = p.position.targetCoordinates.map((t:any)=>sgfCoord(t.row,t.column)).join(',');
            for (const [role, first] of [['attacker', opposite(target)], ['defender', target]] as const) {
              const name = `${p.id.replace(/[^a-z0-9]+/gi,'-')}-${role}`;
              const input:any = {
                filename: `${name}.sgf`,
                masked_sgf_str: p.sgf.replace(/PL\[[BW]\]/, `PL[${first === 'black' ? 'B' : 'W'}]`),
                winning_color: first === 'black' ? 'b' : 'w',
                turn_color: first === 'black' ? 'b' : 'w',
                black_crucial_stone: target === 'black' ? crucial : '',
                white_crucial_stone: target === 'white' ? crucial : '',
                black_search_goal: target === 'black' ? 'TOLIVE' : 'TOKILL',
                white_search_goal: target === 'white' ? 'TOLIVE' : 'TOKILL',
                black_ko_rule: 'allow_ko',
                white_ko_rule: 'allow_ko',
                region: allRegion(p.position.boardSize),
              };
              fs.writeFileSync(`/tmp/rz-problems/${name}.json`, JSON.stringify(input));
              candidate.push(`${name}.json`);
            }
          }
          fs.writeFileSync('/tmp/rz-candidate.list', candidate.join('\n')+'\n');
          console.log(candidate.join('\n'));
          EOF
          npx vite-node .work1-rz-export.ts
          rm .work1-rz-export.ts

      - name: Build pinned Relevance-Zone source in pinned image
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE='rockmanray/gorzone@sha256:1d1b6babbd6c5978c14394aad16aeffcff3106eb78574ee8a577bbeec596849f'
          git clone --quiet https://github.com/rlglab/study-LD-RZ.git /tmp/rz
          cd /tmp/rz
          git checkout --quiet be5c678694b3d2326e9924dad4443e0910d52cdc
          test "$(git rev-parse HEAD)" = 'be5c678694b3d2326e9924dad4443e0910d52cdc'
          cp -a /tmp/rz-problems ./work1-problems
          cp /tmp/rz-candidate.list ./work1-candidate.list
          cp cfg/RZS-TT.cfg ./work1.cfg
          sed -i 's/^SIM_TIME_LIMIT=.*/SIM_TIME_LIMIT=5/' work1.cfg
          sed -i 's/^NUM_THREAD=.*/NUM_THREAD=1/' work1.cfg
          sed -i 's/^USE_TIME_SEED=.*/USE_TIME_SEED=false/' work1.cfg
          sed -i 's/^RANDOM_SEED=.*/RANDOM_SEED=1/' work1.cfg
          sed -i 's#^PROBLEM_DIR=.*#PROBLEM_DIR=work1-problems#' work1.cfg
          sed -i 's#^RESULT_DIR=.*#RESULT_DIR=work1-result#' work1.cfg
          sed -i 's#^PROBLEM_FILTER=.*#PROBLEM_FILTER=work1-candidate.list#' work1.cfg
          mkdir -p work1-result
          docker pull "$IMAGE"
          docker run --rm -v /tmp/rz:/workspace -w /workspace --entrypoint bash "$IMAGE" -lc './scripts/clean-up.sh && ./scripts/setup-cmake.sh release caffe2 && make -j2'
          test -x Release/CGI

      - name: Benchmark RZ executable on common corpus
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE='rockmanray/gorzone@sha256:1d1b6babbd6c5978c14394aad16aeffcff3106eb78574ee8a577bbeec596849f'
          cd /tmp/rz
          START=$(date +%s%N)
          set +e
          timeout 90s docker run --rm -v /tmp/rz:/workspace -w /workspace --entrypoint bash "$IMAGE" -lc 'Release/CGI -conf_file work1.cfg -mode tsumego_solver' 2>&1 | tee /tmp/rz-runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e
          END=$(date +%s%N)
          echo "WORK1_RZ_EXIT=$STATUS ELAPSED_MS=$(( (END-START)/1000000 ))"
          grep -E '---- Solving|Result:|NumSimulations|Time|sgf format error|bad sgf|ERROR|Error' /tmp/rz-runtime.log || true
          find work1-result -maxdepth 1 -type f -name 'result_*.json' -print -exec cat {} \; || true
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124

  darkforest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Export exact 19x19 common-corpus position
        shell: bash
        run: |
          set -euxo pipefail
          npm ci
          cat > .work1-darkforest-export.ts <<'EOF'
          import fs from 'node:fs';
          import { buildReuseSpikeCorpus } from './src/core/endgame/testlab/ReuseSpikeCorpus';
          const corpus = buildReuseSpikeCorpus();
          const targetColor = (p:any) => {
            const colors = new Set(p.position.targetCoordinates.map((t:any) => p.position.stones.find((s:any) => s.row === t.row && s.column === t.column)?.color).filter(Boolean));
            return colors.size === 1 ? [...colors][0] as string : undefined;
          };
          const opposite = (c:string) => c === 'black' ? 'white' : 'black';
          for (const p of corpus) {
            if (p.position.boardSize !== 19) {
              console.log(JSON.stringify({solver:'darkforest',case:p.id,size:p.position.boardSize,outcome:'unsupported',reason:'pinned upstream BOARD_SIZE is fixed at 19'}));
              continue;
            }
            const target = targetColor(p); if (!target) continue;
            const targetStoneCount = p.position.targetCoordinates.length;
            for (const [role, first] of [['attacker', opposite(target)], ['defender', target]] as const) {
              const lines = [`${first} ${target} ${targetStoneCount} ${p.position.stones.length}`];
              for (const s of p.position.stones) lines.push(`${s.column} ${s.row} ${s.color}`);
              fs.writeFileSync(`/tmp/darkforest-${role}.txt`, lines.join('\n')+'\n');
            }
          }
          EOF
          npx vite-node .work1-darkforest-export.ts | tee /tmp/darkforest-unsupported.jsonl
          rm .work1-darkforest-export.ts

      - name: Build pinned Darkforest minimal BSD harness
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/facebookresearch/darkforestGo.git /tmp/darkforest
          cd /tmp/darkforest
          git checkout --quiet ef1885ed5004dac8cbea2cbd3644706565af0876
          test "$(git rev-parse HEAD)" = 'ef1885ed5004dac8cbea2cbd3644706565af0876'
          cat > /tmp/work1-darkforest.cpp <<'EOF'
          #include <chrono>
          #include <fstream>
          #include <iostream>
          #include <string>
          extern "C" {
          #include "board/board.h"
          #include "tsumego/solver.h"
          }
          int main(int argc, char** argv) {
            if (argc != 2) return 2;
            std::ifstream in(argv[1]);
            std::string first, target; int targetCount=0, stoneCount=0;
            in >> first >> target >> targetCount >> stoneCount;
            Board b; ClearBoard(&b);
            for (int i=0;i<stoneCount;i++) {
              int x,y; std::string c; in >> x >> y >> c;
              if (!PlaceHandicap(&b, x, y, c=="black" ? S_BLACK : S_WHITE)) return 3;
            }
            b._next_player = first=="black" ? S_BLACK : S_WHITE;
            TGCriterion crit{};
            crit.target_player = target=="black" ? S_BLACK : S_WHITE;
            crit.dead_thres = targetCount;
            GetBoardBBox(&b, &crit.region);
            crit.max_count = 2000000;
            AllMoves moves{};
            auto start=std::chrono::steady_clock::now();
            int rc=TsumegoSearch(&b, &crit, &moves);
            auto ms=std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::steady_clock::now()-start).count();
            std::cout << "WORK1_DARKFOREST rc="<<rc<<" elapsed_ms="<<ms<<" moves="<<moves.num_moves<<" first="<<first<<" target="<<target<<"\n";
            return rc;
          }
          EOF
          g++ -O3 -std=c++11 -I. -Icommon -Iboard -Itsumego common/common.c board/board.c tsumego/rank_move.c tsumego/solver.c /tmp/work1-darkforest.cpp -lm -o /tmp/work1-darkforest

      - name: Benchmark Darkforest executable on common corpus
        shell: bash
        run: |
          set -euxo pipefail
          for role in attacker defender; do
            if test -f "/tmp/darkforest-${role}.txt"; then
              echo "ROLE=$role"
              timeout 20s /tmp/work1-darkforest "/tmp/darkforest-${role}.txt" | tee "/tmp/darkforest-${role}.log"
            fi
          done
