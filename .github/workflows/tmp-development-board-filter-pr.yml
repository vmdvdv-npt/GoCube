name: Temporary Development Workspace board filter PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply embedded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-development-board-filter.yml').read_text()
          marker = "      - name: Apply board filter implementation, tests, and canonical docs\n        shell: python\n        run: |\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n      - name: Install dependencies", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, '<embedded-board-filter-patch>', 'exec'), {})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted unit tests
        run: npm test -- src/app/development/DevelopmentWorkspaceCompatibility.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check

      - name: Commit verified change and remove temporary workflows
        run: |
          rm .github/workflows/tmp-development-board-filter.yml
          rm .github/workflows/tmp-development-board-filter-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/development/DevelopmentWorkspace.tsx \
                  src/app/development/DevelopmentWorkspaceCompatibility.test.ts \
                  docs/GAME_CUBE_GO.md \
                  .github/workflows/tmp-development-board-filter.yml \
                  .github/workflows/tmp-development-board-filter-pr.yml
          git commit -m "Add board filter to Development Workspace"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
