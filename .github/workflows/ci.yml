name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Firefox only
        run: npx playwright install --with-deps firefox

      - name: Verify Cube view fold with software WebGL Firefox
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            npx playwright test e2e/cube-view-fold.spec.ts --project=firefox --headed --workers=1
