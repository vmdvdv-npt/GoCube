name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Cube 3D interaction/navigation E2E only
        run: npx playwright test e2e/cube3d-interaction-navigation.spec.ts --project=chromium --workers=1

      - name: Run Cube 3D motion-performance E2E only
        run: npx playwright test e2e/cube3d-motion-performance.spec.ts --project=chromium --workers=1
