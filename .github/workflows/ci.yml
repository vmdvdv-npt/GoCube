name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

jobs:
  patch-contextual-endgame-doc:
    if: github.event_name == 'pull_request' && github.head_ref == 'ui/endgame-contextual-status-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch canonical Endgame Review requirements and restore workflow files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/GAME_CUBE_GO.md')
          text = path.read_text(encoding='utf-8')
          old = '''## 9.1. Выбор и ручная классификация группы

- При наведении подсвечивается вся logical group, а не отдельный камень.
- Click по **любому** камню группы выбирает всю группу.
- Click работает независимо от текущего происхождения статуса: unresolved, automatic proposal или ранее установленное пользователем решение остаются интерактивными до завершения review.
- Для выбранной группы показываются три действия: `Alive`, `Dead`, `Seki`.
- Пользователь может повторно менять статус сколько угодно раз до явного завершения scoring review.
- Пользовательский выбор перекрывает automatic proposal этой группы.
'''
          new = '''## 9.1. Выбор и ручная классификация группы

- При наведении подсвечивается вся logical group, а не отдельный камень.
- Click по **любому** камню группы выбирает всю группу.
- Click работает независимо от текущего происхождения статуса: unresolved, automatic proposal или ранее установленное пользователем решение остаются интерактивными до завершения review.
- После click рядом с выбранной logical group непосредственно над игровой областью показывается ровно один компактный floating control с действиями `Alive`, `Dead`, `Seki`; эти три кнопки располагаются вертикально одна под другой и относятся только к текущей выбранной группе.
- Group-local `Alive` / `Dead` / `Seki` не занимают постоянное место в общей левой панели. В ней остаются только общая информация review и global actions, включая `Finish scoring`.
- Floating control привязан к видимому bounding box всей выбранной logical group, а не к clicked stone. Предпочтительное положение — над группой, по её горизонтальному центру и с небольшим зазором от stones/contour. Если сверху места недостаточно, используются в порядке пригодности положение снизу, слева или справа.
- Control целиком удерживается внутри доступной игровой области и viewport. Он не должен уходить за край экрана или становиться недоступным из-за близости группы к краю.
- Для группы любой формы, включая logical group через Torus seam или реальные Cube topology edges, существует только один selection и один floating control: control не дублируется возле отдельных stones/copies и не разбивается на несколько частей.
- При выборе другой группы прежняя spatial привязка заменяется новой; одновременно отображается не более одного такого control. Повторный click по уже выбранной группе сохраняет привязку к ней.
- Текущий статус выбранной группы показывается selected-state соответствующей кнопки. Semantic color основной group annotation остаётся главным обозначением `Alive` / `Dead` / `Seki`; сами кнопки не превращаются в крупные semantic-color панели.
- Floating control находится выше renderer layer и принимает pointer events как screen-space UI. Click по его кнопке выполняет только классификацию: не ставит stone, не меняет board selection, не запускает pan/navigation и не должен просачиваться в игровую область под control.
- После выбора `Alive`, `Dead` или `Seki` control остаётся доступным у той же группы, чтобы решение можно было немедленно изменить повторно.
- При zoom, pan, Torus navigation, Cube 2D navigation/rebuild и переносе Cube TOP/BOTTOM pair экранная позиция control пересчитывается по новому положению выбранной группы. Control не застывает в старой screen position.
- Размер control и его кнопок остаётся удобной screen-space величиной и не масштабируется вместе с zoom доски.
- Появление control допускает короткий ненавязчивый fade/translate; смена выбранной группы не должна создавать длинную очередь animations.
- Пользователь может повторно менять статус сколько угодно раз до явного завершения scoring review.
- Пользовательский выбор перекрывает automatic proposal этой группы.
'''
          if old not in text:
              raise SystemExit('Canonical Endgame Review block was not found exactly; refusing partial documentation edit.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/tmp-endgame-doc-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_CUBE_GO.md .github/workflows/ci.yml .github/workflows/tmp-endgame-doc-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Document contextual endgame group controls"
          git push origin "HEAD:${{ github.head_ref }}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select CI mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mode="standard"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[full]"* ]]; then
              mode="full"
            elif [[ "$PR_TITLE" == *"[no-test]"* ]]; then
              mode="none"
            fi
          else
            # Normal main pushes do not repeat PR CI. Release finalization is always full.
            mode="none"
            if [[ "$HEAD_MESSAGE" == release:\ finalize\ * ]]; then
              mode="full"
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI mode: $mode"

      - uses: actions/checkout@v7
        if: steps.mode.outputs.mode != 'none'

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.mode != 'none'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.mode.outputs.mode != 'none'

      - run: npm run lint
        if: steps.mode.outputs.mode != 'none'

      - run: npm run typecheck
        if: steps.mode.outputs.mode != 'none'

      - run: npm run test:coverage
        if: steps.mode.outputs.mode != 'none'

      - run: npm run build
        if: steps.mode.outputs.mode != 'none'

      - name: Install Playwright browsers
        if: steps.mode.outputs.mode != 'none'
        env:
          CI_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$CI_MODE" == "full" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright E2E
        if: steps.mode.outputs.mode != 'none'
        env:
          CI_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$CI_MODE" == "full" ]]; then
            npm run test:e2e
          else
            npm run test:e2e -- --project=chromium
          fi

  release:
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: finalize ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="$(printf '%s\n' "$RELEASE_MESSAGE" | sed -n '1s/^release: finalize //p')"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping it."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "GoCube $tag" --generate-notes
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=ci/full-release-gate \
            -f description="Full CI passed and release $tag is published" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
