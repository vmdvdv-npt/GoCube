name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select CI mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mode="standard"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[full]"* ]]; then
              mode="full"
            elif [[ "$PR_TITLE" == *"[no-test]"* ]]; then
              mode="none"
            fi
          else
            mode="none"
            if [[ "$HEAD_MESSAGE" == release:\ finalize\ * ]]; then
              mode="full"
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI mode: $mode"

      - uses: actions/checkout@v7
        if: steps.mode.outputs.mode != 'none'

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.mode != 'none'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.mode.outputs.mode != 'none'

      - run: npm run lint
        if: steps.mode.outputs.mode != 'none'

      - run: npm run test:coverage
        if: steps.mode.outputs.mode != 'none'

      - name: Run npm test explicitly for Engine2 cleanup validation
        if: steps.mode.outputs.mode != 'none'
        run: npm test

      - name: Audit removed Test Case runtime and preserved Engine2 infrastructure
        if: steps.mode.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          pattern='LiveTest|LiveTestGenerator|generateLiveTestCase|replayLiveTestCase|GameLikeGenerator|EndgameGenerator|Generate Game|Generate Endgame|Generate Corpus|Test ID|TestCase|TestCaseReplayService|ReplayableTestCase|TestCaseIdentity|encodeTestCaseId|decodeTestCaseId|ControlledEndgame|controlled-mixed-endgame|game-like-background|ExternalCorpus|xuanxuan|LIVE_ENDGAME_TEST_CASE_VARIANT|CONTROLLED_ENDGAME_TEST_CASE_VARIANT|VITE_ENABLE_LIVE_TEST_GENERATORS|LocalAnalysisClient|lab:local-ai'
          echo 'Checking runtime/source/config paths for obsolete Test Case concepts...'
          if rg -n --hidden "$pattern" src e2e tools package.json vite.config.ts playwright.config.ts .github; then
            echo 'Obsolete Test Case runtime/config reference remains.' >&2
            exit 1
          fi
          echo 'Runtime/source/config dead-code audit: zero matches.'
          echo 'Repository documentation matches (informational only):'
          rg -n "$pattern" docs || true
          test -f src/core/endgame/testlab/Engine2AdversarialCorpus.ts
          test -f src/core/endgame/testlab/Engine2AdversarialCorpus.test.ts
          test -f src/core/endgame/testlab/Engine2FinalEvaluation.benchmark.test.ts
          test -f src/core/endgame/testlab/Engine2ConfidenceCorpus.ts
          test -f src/core/endgame/testlab/Engine2ConfidenceAutoSelectionCorpus.ts
          test -f src/core/endgame/testlab/EndgameTestLab.ts
          test -f src/core/endgame/testlab/EndgameTestLab.test.ts
          test -f src/core/endgame/testlab/DifferentialOracle.ts
          test -f src/core/endgame/testlab/DifferentialOracle.test.ts
          echo 'Required Engine2 correctness infrastructure is present.'

      - name: Run Engine2 final-evaluation benchmark
        if: steps.mode.outputs.mode != 'none'
        run: npm run benchmark:engine2:final-evaluation

      - name: Run Engine2 confidence benchmark
        if: steps.mode.outputs.mode != 'none'
        run: npm run benchmark:engine2:confidence

      - run: npm run typecheck:engine2
        if: steps.mode.outputs.mode != 'none'

      - run: npm run build:engine2
        if: steps.mode.outputs.mode != 'none'

      - name: Install Playwright browsers
        if: steps.mode.outputs.mode != 'none'
        env:
          CI_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$CI_MODE" == "full" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright E2E
        if: steps.mode.outputs.mode != 'none'
        env:
          CI_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$CI_MODE" == "full" ]]; then
            npm run test:e2e
          else
            npm run test:e2e -- --project=chromium
          fi

  release:
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: finalize ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="$(printf '%s\n' "$RELEASE_MESSAGE" | sed -n '1s/^release: finalize //p')"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping it."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "GoCube $tag" --generate-notes
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=ci/full-release-gate \
            -f description="Full CI passed and release $tag is published" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
