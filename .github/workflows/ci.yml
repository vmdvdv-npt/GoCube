name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/0.2-release-acceptance
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Merge latest main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply Torus fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/app/TorusGameBase.tsx',
              """    // The legacy renderer expansion is deliberately kept disabled. The opt-in
              // duplicate view is now a separate one-line, non-interactive edge overlay.
              renderer.setDuplicateRegionsVisible(false);
              renderer.setEndgameOverlay(
                viewModel.phase === 'endgame'
                  ? {
                      groups: renderGroups,
                      hoveredGroupId,
                      selectedGroupId,
                    }
                  : null,
              );
              renderer.render(viewModel);
          """,
              """    // The legacy renderer expansion is deliberately kept disabled. The opt-in
              // duplicate view is now a separate one-line, non-interactive edge overlay.
              renderer.setDuplicateRegionsVisible(false);
              if (viewModel.phase !== 'endgame') renderer.setEndgameOverlay(null);
              renderer.render(viewModel);
          """,
          )

          replace_once(
              'src/app/TorusGameBase.tsx',
              """  }, [
            controller,
            hoveredGroupId,
            renderGroups,
            selectedGroupId,
            showDuplicateRegions,
            showMoveNumbers,
            viewModel,
          ]);

          useEffect(() => {
            const svg = svgRef.current;
          """,
              """  }, [controller, showDuplicateRegions, showMoveNumbers, viewModel]);

          useEffect(() => {
            const renderer = rendererRef.current;
            if (!renderer) return;

            renderer.setEndgameOverlay(
              viewModel.phase === 'endgame'
                ? {
                    groups: renderGroups,
                    hoveredGroupId,
                    selectedGroupId,
                  }
                : null,
            );
          }, [hoveredGroupId, renderGroups, selectedGroupId, viewModel.phase]);

          useEffect(() => {
            const svg = svgRef.current;
          """,
          )

          replace_once(
              'src/renderer2d/Torus2DRendererBase.ts',
              """  setEndgameOverlay(overlay: Torus2DEndgameOverlay | null): void {
            this.endgameOverlay = overlay ?? EMPTY_ENDGAME_OVERLAY;
          }
          """,
              """  setEndgameOverlay(overlay: Torus2DEndgameOverlay | null): void {
            this.endgameOverlay = overlay ?? EMPTY_ENDGAME_OVERLAY;
            this.renderEndgameOverlay();
          }
          """,
          )

          replace_once(
              'src/renderer2d/Torus2DRendererBase.ts',
              """    this.scene = scene;
            this.renderedViewModel = viewModel;
            this.endgameSegments = buildTorus2DEndgameSegments(scene, this.endgameOverlay);

            this.svg.setAttribute('viewBox', `0 0 ${scene.viewBoxSize} ${scene.viewBoxSize}`);
          """,
              """    this.scene = scene;
            this.renderedViewModel = viewModel;

            this.svg.setAttribute('viewBox', `0 0 ${scene.viewBoxSize} ${scene.viewBoxSize}`);
          """,
          )

          replace_once(
              'src/renderer2d/Torus2DRendererBase.ts',
              """    const endgameLines = document.createElementNS(SVG_NS, 'g');
            endgameLines.setAttribute('class', 'torus-board__endgame-lines');
            for (const segment of this.endgameSegments) {
              const style = endgameLineStyle(
                segment.status,
                segment.groupColor,
                segment.temporary,
              );
              const line = document.createElementNS(SVG_NS, 'line');
              const attributes: Record<string, string> = {
                x1: String(segment.x1),
                y1: String(segment.y1),
                x2: String(segment.x2),
                y2: String(segment.y2),
                stroke: style.stroke,
                'stroke-width': String(TORUS_ENDGAME_LINE_WIDTH_PX),
                'stroke-linecap': 'butt',
                'vector-effect': 'non-scaling-stroke',
                'pointer-events': 'none',
                opacity: String(style.opacity),
                'data-endgame-group-id': segment.groupId,
                'data-endgame-status': segment.status ?? 'preview',
                'data-endgame-temporary': segment.temporary ? 'true' : 'false',
                class: 'torus-board__endgame-line',
              };
              if (style.strokeDasharray) attributes['stroke-dasharray'] = style.strokeDasharray;
              setAttributes(line, attributes);
              endgameLines.appendChild(line);
            }

            this.movePreviewLayer = null;
            this.svg.replaceChildren(
              background,
              grid,
              hitTargets,
              stones,
              ...(this.endgameSegments.length > 0 ? [endgameLines] : []),
            );
            this.renderMovePreview();
          """,
              """    this.movePreviewLayer = null;
            this.svg.replaceChildren(background, grid, hitTargets, stones);
            this.renderEndgameOverlay();
            this.renderMovePreview();
          """,
          )

          replace_once(
              'src/renderer2d/Torus2DRendererBase.ts',
              """  visualPointFromClientPosition(x: number, y: number): Torus2DVisualHit | null {
          """,
              """  private renderEndgameOverlay(): void {
            const scene = this.scene;
            if (!scene || this.panAnimating) return;

            this.endgameSegments = buildTorus2DEndgameSegments(scene, this.endgameOverlay);
            this.svg.querySelector('.torus-board__endgame-lines')?.remove();
            if (this.endgameSegments.length === 0) return;

            const document = this.svg.ownerDocument;
            const endgameLines = document.createElementNS(SVG_NS, 'g');
            endgameLines.setAttribute('class', 'torus-board__endgame-lines');
            for (const segment of this.endgameSegments) {
              const style = endgameLineStyle(
                segment.status,
                segment.groupColor,
                segment.temporary,
              );
              const line = document.createElementNS(SVG_NS, 'line');
              const attributes: Record<string, string> = {
                x1: String(segment.x1),
                y1: String(segment.y1),
                x2: String(segment.x2),
                y2: String(segment.y2),
                stroke: style.stroke,
                'stroke-width': String(TORUS_ENDGAME_LINE_WIDTH_PX),
                'stroke-linecap': 'butt',
                'vector-effect': 'non-scaling-stroke',
                'pointer-events': 'none',
                opacity: String(style.opacity),
                'data-endgame-group-id': segment.groupId,
                'data-endgame-status': segment.status ?? 'preview',
                'data-endgame-temporary': segment.temporary ? 'true' : 'false',
                class: 'torus-board__endgame-line',
              };
              if (style.strokeDasharray) attributes['stroke-dasharray'] = style.strokeDasharray;
              setAttributes(line, attributes);
              endgameLines.appendChild(line);
            }
            this.svg.appendChild(endgameLines);
          }

          visualPointFromClientPosition(x: number, y: number): Torus2DVisualHit | null {
          """,
          )

          replace_once(
              'e2e/torus-pan-animation.spec.ts',
              """  await page.evaluate(() => {
            for (const direction of ['right', 'right', 'left', 'down'] as const) {
              document.querySelector<HTMLButtonElement>(
                `[aria-label=\"Shift torus view ${direction}\"]`,
              )?.click();
            }
          });

          const board = page.locator('.torus-board');
          await expect(board).toHaveAttribute('data-pan-animating', 'true');
          await expect(page.getByRole('button', { name: /Pass/ })).toBeEnabled();
          await expect(page.getByRole('button', { name: 'Undo' })).toBeEnabled();
          await expect(page.getByRole('button', { name: 'Redo' })).toBeDisabled();
          await expect(page.getByRole('button', { name: 'New game', exact: true })).toBeEnabled();
          await expect(page.getByLabel('Номера ходов')).toBeEnabled();
          await expect(page.getByLabel('Показывать дублирующие области')).toBeEnabled();

          await expect(board).toHaveAttribute('data-pan-animating', 'false', { timeout: 2_000 });
          // The first command wins; presses received during its animation are ignored.
          await expect(board).toHaveAttribute('data-view-offset-x', '1');
          await expect(board).toHaveAttribute('data-view-offset-y', '0');
          """,
              """  const board = page.locator('.torus-board');
          const shiftRight = page.getByRole('button', { name: 'Shift torus view right' });
          const shiftDown = page.getByRole('button', { name: 'Shift torus view down' });

          await shiftRight.click();
          await expect(board).toHaveAttribute('data-pan-animating', 'true');
          await shiftDown.click();
          await expect(board).toHaveAttribute('data-pan-direction', 'right');
          await expect(page.getByRole('button', { name: /Pass/ })).toBeEnabled();
          await expect(page.getByRole('button', { name: 'Undo' })).toBeEnabled();
          await expect(page.getByRole('button', { name: 'Redo' })).toBeDisabled();
          await expect(page.getByRole('button', { name: 'New game', exact: true })).toBeEnabled();
          await expect(page.getByLabel('Номера ходов')).toBeEnabled();
          await expect(page.getByLabel('Показывать дублирующие области')).toBeEnabled();

          await expect(board).toHaveAttribute('data-pan-animating', 'false', { timeout: 2_000 });
          await expect(board).toHaveAttribute('data-view-offset-x', '1');
          await expect(board).toHaveAttribute('data-view-offset-y', '0');

          await shiftDown.click();
          await expect(board).toHaveAttribute('data-pan-animating', 'true');
          await expect(board).toHaveAttribute('data-pan-animating', 'false', { timeout: 2_000 });
          await expect(board).toHaveAttribute('data-view-offset-x', '1');
          await expect(board).toHaveAttribute('data-view-offset-y', '1');
          """,
          )
          PY
          git diff --check
          rm -f .github/workflows/apply-final-release-fixes.yml

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify affected cross-browser E2E
        run: >-
          npx playwright test
          e2e/final-board-result.spec.ts
          e2e/manual-endgame-ux.spec.ts
          e2e/release.spec.ts
          e2e/torus-endgame-review-reload.spec.ts
          e2e/torus-pan-animation.spec.ts
          --project=chromium --project=firefox --project=webkit

      - name: Commit verified fix
        run: |
          git add -A
          git commit -m "Stabilize Torus endgame interactions across browsers"
          git push origin HEAD:fix/0.2-release-acceptance
