name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Firefox only
        run: npx playwright install --with-deps firefox

      - name: Reproduce Cube view fold in Firefox only
        run: npx playwright test e2e/cube-view-fold.spec.ts --project=firefox --workers=1
