name: Apply default komi 1.5

on:
  push:
    branches:
      - feat/default-komi-1-5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'src/app/App.tsx',
              'const DEFAULT_KOMI = 0.5;',
              'const DEFAULT_KOMI = 1.5;',
          )
          replace_exact(
              'src/app/Cube2DGameController.ts',
              'komi: snapshot?.komi ?? options.komi ?? 0.5,',
              'komi: snapshot?.komi ?? options.komi ?? 1.5,',
          )
          replace_exact(
              'src/app/TorusGameController.ts',
              'komi: snapshot?.komi ?? options.komi ?? 0.5,',
              'komi: snapshot?.komi ?? options.komi ?? 1.5,',
          )
          replace_exact(
              'src/app/GameControllerDefaults.test.ts',
              "it('defaults new Cube and Torus sessions to komi 0.5', () => {",
              "it('defaults new Cube and Torus sessions to komi 1.5', () => {",
          )
          replace_exact(
              'src/app/GameControllerDefaults.test.ts',
              'expect(cube.snapshot().komi).toBe(0.5);',
              'expect(cube.snapshot().komi).toBe(1.5);',
          )
          replace_exact(
              'src/app/GameControllerDefaults.test.ts',
              'expect(torus.snapshot().komi).toBe(0.5);',
              'expect(torus.snapshot().komi).toBe(1.5);',
          )
          replace_exact(
              'e2e/new-game-default-rules.spec.ts',
              "await expect(page.getByLabel('Komi')).toHaveValue('0.5');",
              "await expect(page.getByLabel('Komi')).toHaveValue('1.5');",
          )
          replace_exact(
              'docs/GAME_CUBE_GO.md',
              '- Если сохранённого предыдущего komi нет, fallback для New Game — `0.5`.',
              '- Если сохранённого предыдущего komi нет, fallback для New Game — `1.5`.',
          )
          PY

      - name: Verify old default patterns are gone
        run: |
          ! grep -RInE 'DEFAULT_KOMI = 0\.5|options\.komi \?\? 0\.5|sessions to komi 0\.5|toHaveValue\('\''0\.5'\''\)' src e2e
          ! grep -F 'fallback для New Game — `0.5`.' docs/GAME_CUBE_GO.md

      - name: Install dependencies
        run: npm ci

      - name: Run focused unit test
        run: npm test -- src/app/GameControllerDefaults.test.ts

      - name: Build
        run: npm run build

      - name: Commit intended changes and remove helper workflow
        run: |
          rm .github/workflows/apply-default-komi.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/app/Cube2DGameController.ts src/app/TorusGameController.ts src/app/GameControllerDefaults.test.ts e2e/new-game-default-rules.spec.ts docs/GAME_CUBE_GO.md .github/workflows/apply-default-komi.yml
          git commit -m 'Set default komi to 1.5'
          git push origin HEAD:feat/default-komi-1-5
