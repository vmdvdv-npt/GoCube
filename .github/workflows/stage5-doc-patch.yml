name: Stage 5 architecture patch

on:
  push:
    branches:
      - codex/alphazero-live-acceptance-stage5

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply stage5 architecture patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/alphazero-live-acceptance-stage5
      - name: Update canonical testing architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          needle = 'E2E использует mocked AlphaZero transport и реальный GoCube application path/Renderer. CI не требует реально запущенного Python AlphaZero service. Отдельный E2E проверяет compatibility failure и отсутствие application crash.\n'
          addition = needle + '\nОтдельный opt-in live-service smoke является acceptance-инструментом поверх той же Playwright/browser boundary и не входит в обязательный CI gate. Он запускается явно командой `npm run test:alphazero-live`, обязан использовать реальный `/v1/health`, `/v1/checkpoints` и `/v1/move`, выбирать compatible checkpoint только по descriptor metadata и доказывать реальный Human-vs-Bot browser path с neural MCTS и authoritative History. Если live smoke запрошен явно, недоступный или несовместимый AlphaZero service является failure, а не skip. При обычном CI этот spec остаётся skipped и не требует GPU/Python service.\n'
          if text.count(needle) != 1:
              raise SystemExit('Expected exactly one AlphaZero E2E architecture paragraph')
          path.write_text(text.replace(needle, addition))
          PY
      - name: Commit architecture update and remove helper workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/stage5-doc-patch.yml
          git add docs/ARCHITECTURE.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: document opt-in AlphaZero live smoke"
          git push origin HEAD:codex/alphazero-live-acceptance-stage5
