name: Patch Development entry documentation

on:
  push:
    branches:
      - codex/document-development-startup-only

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-development-startup-only
      - name: Update canonical Development entry requirement
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/GAME_CUBE_GO.md")
          text = path.read_text()
          old = """- В основном интерфейсе доступна текстовая ссылка `development`, а не отдельная кнопка.\n- В активной партии ссылка располагается в общей левой панели непосредственно под блоком display options: под `Move numbers` в Cube и под `Move numbers` / `Show duplicate regions` в Torus. Ссылка не должна перекрывать controls игрового renderer, включая Cube `2D / 3D`.\n"""
          new = """- На стартовом экране `New Game` и на экране `Continue saved game?` в правом верхнем углу доступна текстовая ссылка `development`, а не отдельная кнопка.\n- В активной партии entry `development` не показывается и не занимает место в общей игровой панели.\n"""
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one Development entry block")
          path.write_text(text.replace(old, new))
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-development-doc.yml
          git add docs/GAME_CUBE_GO.md
          git commit -m "Document startup-only Development entry"
          git push origin HEAD:codex/document-development-startup-only
