name: Record Final Group Judge Benchmark Once

on:
  push:
    branches:
      - feature/katago-final-group-judge-v1
    paths:
      - .github/workflows/record-final-group-judge-benchmark-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/katago-final-group-judge-v1
          fetch-depth: 0
      - name: Record measured browser benchmark and remove helper
        shell: bash
        env:
          BENCHMARK_MD_B64: 
        run: |
          set -euo pipefail
          if ! grep -q '^## 39.7. Measured browser benchmark' docs/ENDGAME_ENGINE.md; then
            printf '%s' "$BENCHMARK_MD_B64" | base64 --decode >> docs/ENDGAME_ENGINE.md
          fi
          rm .github/workflows/record-final-group-judge-benchmark-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENDGAME_ENGINE.md .github/workflows/record-final-group-judge-benchmark-once.yml
          git commit -m 'docs: record final group judge browser benchmark'
          git status --short
          git push origin HEAD:feature/katago-final-group-judge-v1
